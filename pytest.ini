# pytest configuration (roadmap M3).
#
# `pythonpath = .` is the important line. `tests/` is not a package, so pytest
# puts *that* directory on `sys.path`, not the repository root — which means
# `python -m pytest` works (the `-m` puts the working directory on the path) and
# a bare `pytest tests` fails with `ModuleNotFoundError: No module named 'app'`.
# Two ways of running the suite that disagree is exactly the kind of thing that
# turns into "works on my machine", so it is fixed here rather than in the
# commands that invoke it.

[pytest]
testpaths = tests
pythonpath = .
