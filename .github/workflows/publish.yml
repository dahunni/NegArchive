# Publish the two container images to the GitHub Container Registry.
#
# Why this exists: installing or updating NegArchive should not require building
# two images on the machine it runs on. A build needs several gigabytes of disk
# and a working toolchain, and the machine that most wants to run this is a NAS or
# a mini PC that has neither. With published images, `docker compose pull` is the
# whole update.
#
#   ghcr.io/<owner>/negarchive-web        the FastAPI backend
#   ghcr.io/<owner>/negarchive-frontend   the Next.js frontend
#
# Tags: `latest` and the version for a `v*` tag, `main` and the short SHA for a
# commit on main. Both images are built for **linux/amd64 and linux/arm64**, so
# the same compose file runs on an Apple Silicon Mac, an Intel NAS and a Pi.
#
# **Each architecture is built on a runner of that architecture** — amd64 on
# `ubuntu-latest`, arm64 on `ubuntu-24.04-arm`, which GitHub provides free to
# public repositories — and the two are joined into one manifest list afterwards.
# The first version of this file emulated arm64 with QEMU on the amd64 runner,
# and the frontend's `next build` hung under emulation: once for the full
# six-hour job limit, once again on the v0.7.0 tag. Native runners
# make the build minutes long and remove the hang; `timeout-minutes` makes sure
# that if anything ever does hang, it fails loudly inside the hour.
#
# A commit on main is published only **after CI passes on it** (`workflow_run`),
# so a red build never becomes an image somebody pulls. A `v*` tag publishes
# straight away: it points at a commit main has already tested. A manual run
# (`workflow_dispatch`) from any branch pushes only the short-SHA tag, which is
# how a change to this file is tried out before it is trusted with `latest`.
#
# Nothing here needs a secret: GITHUB_TOKEN can write packages for its own
# repository. The first published package is **private** until you make it public
# in the package settings (Packages → negarchive-web → Package settings →
# Change visibility) — GitHub defaults it that way even for a public repository.

name: Publish images

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # A push to main publishes only what CI has just passed on; the checkout below
  # uses the tested commit, not the default branch the event nominally points at.
  BUILD_REF: ${{ github.event.workflow_run.head_sha || github.ref }}

jobs:
  build:
    name: ${{ matrix.image }} on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Native builds take minutes. Anything longer than this is a hang, not a build.
    timeout-minutes: 45
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    strategy:
      fail-fast: false
      matrix:
        image: [negarchive-web, negarchive-frontend]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: negarchive-web
            context: .
            dockerfile: Dockerfile
          - image: negarchive-frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Name this platform for the artifact
        id: slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "platform=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=NegArchive — a self-hosted archive for film photography
            org.opencontainers.image.licenses=MIT

      # Pushed by digest only, untagged: the tags go onto the manifest list that
      # the merge job assembles from both digests.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.slug.outputs.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ steps.slug.outputs.platform }}
          provenance: false

      - name: Hand the digest to the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ steps.slug.outputs.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image }} manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    strategy:
      fail-fast: false
      matrix:
        image: [negarchive-web, negarchive-frontend]

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=${{ github.event.workflow_run.head_sha }},enable=${{ github.event_name == 'workflow_run' }}
            type=sha,format=short

      - name: Join the two architectures into one manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          ls -1
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Show what was published
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
